<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="t">
  <title id="t">햇살이 드는 거실 바닥에 놓인 자동급식기와 고양이 (임시 일러스트)</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6F1E9"/><stop offset=".6" stop-color="#ECE3D6"/><stop offset="1" stop-color="#DFD3C3"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9CAB6"/><stop offset="1" stop-color="#BFAA91"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF8" stop-opacity=".95"/><stop offset="1" stop-color="#FFFDF8" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="body" x1="0" x2="1">
      <stop offset="0" stop-color="#FFFDF9"/><stop offset=".5" stop-color="#EFE8DE"/><stop offset="1" stop-color="#CDBFAE"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" x2="1">
      <stop offset="0" stop-color="#4A443C"/><stop offset=".6" stop-color="#2E2B26"/><stop offset="1" stop-color="#1D1B18"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" x2="1">
      <stop offset="0" stop-color="#ECE9E4"/><stop offset=".3" stop-color="#BDB7AE"/><stop offset=".55" stop-color="#F6F4F0"/><stop offset="1" stop-color="#9C958B"/>
    </linearGradient>
    <radialGradient id="shadow">
      <stop offset="0" stop-color="#3A3128" stop-opacity=".38"/><stop offset="1" stop-color="#3A3128" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="soft-s" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#wall)"/>
  <g filter="url(#soft)" opacity=".75">
    <polygon points="930,80 1130,80 1070,640 870,640" fill="url(#beam)"/>
    <polygon points="1160,80 1360,80 1300,640 1100,640" fill="url(#beam)"/>
  </g>
  <rect y="690" width="1600" height="16" fill="#EFE7DB"/>
  <rect y="704" width="1600" height="296" fill="url(#floor)"/>
  <g stroke="#3A3128" stroke-opacity=".06" stroke-width="2">
    <line x1="0" y1="770" x2="1600" y2="770"/><line x1="0" y1="850" x2="1600" y2="850"/><line x1="0" y1="950" x2="1600" y2="950"/>
  </g>
  <g filter="url(#soft)" opacity=".55">
    <polygon points="880,712 1090,712 1230,1000 960,1000" fill="#FFFBF2"/>
    <polygon points="1110,712 1320,712 1490,1000 1250,1000" fill="#FFFBF2"/>
  </g>
  <rect x="1500" y="0" width="100" height="704" fill="#E9DFD1"/>
  <rect x="1500" y="0" width="14" height="704" fill="#D9CDBD" filter="url(#soft-s)"/>

  <!-- feeder -->
  <ellipse cx="1050" cy="768" rx="120" ry="14" fill="url(#shadow)"/>
  <g transform="translate(926 470) scale(.62)">
    <rect x="96" y="96" width="208" height="372" rx="44" fill="url(#body)"/>
    <rect x="104" y="118" width="8" height="320" rx="4" fill="#fff" opacity=".6"/>
    <rect x="90" y="70" width="220" height="52" rx="26" fill="url(#lid)"/>
    <rect x="142" y="140" width="116" height="66" rx="33" fill="#292722"/>
    <circle cx="178" cy="173" r="16" fill="#111"/>
    <circle cx="174" cy="169" r="3.5" fill="#fff" opacity=".7"/>
    <circle cx="226" cy="173" r="4" fill="#E9C99B"/>
    <rect x="134" y="226" width="132" height="104" rx="24" fill="#292722" opacity=".14"/>
    <path d="M124 362h152a22 22 0 0 1 22 22v72H102v-72a22 22 0 0 1 22-22z" fill="#292722" opacity=".08"/>
    <ellipse cx="200" cy="452" rx="80" ry="20" fill="url(#steel)"/>
    <ellipse cx="200" cy="448" rx="63" ry="13" fill="#D2CDC5"/>
  </g>

  <!-- cat -->
  <ellipse cx="1300" cy="778" rx="110" ry="14" fill="url(#shadow)"/>
  <g transform="translate(1232 508) scale(1.08)" fill="#6B5B4C">
    <path d="M10 250 C-6 170 14 92 64 70 C114 92 134 170 118 250 Z"/>
    <circle cx="64" cy="48" r="42"/>
    <path d="M28 26 L32 -22 L58 8 Z"/>
    <path d="M100 26 L96 -22 L70 8 Z"/>
    <path d="M112 236 C176 240 192 200 164 160" fill="none" stroke="#6B5B4C" stroke-width="15" stroke-linecap="round"/>
  </g>
  <g transform="translate(1232 508) scale(1.08)" fill="#fff" opacity=".12">
    <path d="M22 240 C14 180 26 112 58 82 C40 120 34 180 40 240 Z"/>
  </g>
</svg>
